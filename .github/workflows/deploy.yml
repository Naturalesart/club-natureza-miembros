name: Deploy a Hostinger (SFTP)
# Corre en cada push a main. main = produccion (regla #6 del proyecto:
# nada llega aca sin confirmacion explicita de Leandro).
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4
      - name: Excluir tests y archivos de desarrollo del deploy
        # El deploy sube './*' (todo el repo): se borran del workspace de la corrida (no del repo) antes de subir.
        run: |
          rm -rf tests
          find . -type f \( -name 'test_*.php' -o -name '*Test.php' -o -name 'phpunit*.xml*' -o -name 'composer.json' -o -name 'composer.lock' \) -not -path './.git/*' -print -delete
      - name: Deploy por SFTP a Hostinger
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          local_path: './*'
          remote_path: 'domains/naturalesart.com/public_html/wp-content/plugins/club-natureza-miembros/'
          sftp_only: true
      - name: Verificar que el sitio quedó sano (D5)
        # Solo lectura: si algo falla, el job queda en rojo y GitHub avisa por mail. No revierte ni toca el sitio.
        run: |
          base="https://naturalesart.com"
          verificar() {
            home=$(curl -sS -L --max-time 30 -o /tmp/home.html -w '%{http_code}' "$base/" || echo 000)
            plugin=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$base/wp-content/plugins/club-natureza-miembros/club-natureza-miembros.php" || echo 000)
            api=$(curl -sS -L --max-time 30 -o /dev/null -w '%{http_code}' "$base/wp-json/" || echo 000)
            echo "home=$home plugin=$plugin wp-json=$api"
            [ "$home" = "200" ] && [ "$plugin" = "200" ] && [ "$api" = "200" ] && ! grep -qiE 'error crítico|critical error|Fatal error' /tmp/home.html
          }
          for intento in 1 2 3 4 5 6; do
            if verificar; then echo "Sitio sano tras el deploy."; exit 0; fi
            echo "Intento $intento sin éxito; reintento en 20 s (caché del hosting)."
            sleep 20
          done
          echo "::error::El sitio no respondió bien después del deploy: revisar de inmediato y, si hace falta, revertir con git revert -m 1."
          exit 1
