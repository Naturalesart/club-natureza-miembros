name: Deploy a Hostinger (SFTP)
# Corre en cada push a main. main = produccion (regla #6 del proyecto:
# nada llega aca sin confirmacion explicita de Leandro).
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4
      - name: Excluir tests y archivos de desarrollo del deploy
        # El deploy sube './*' (todo el repo): se borran del workspace de la corrida (no del repo) antes de subir.
        run: |
          rm -rf tests
          find . -path ./.git -prune -o -type f \( -name 'test_*.php' -o -name '*Test.php' -o -name 'phpunit*.xml*' -o -name 'composer.json' -o -name 'composer.lock' \) -print -delete
      - name: Deploy por SFTP a Hostinger
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          local_path: './*'
          remote_path: 'domains/naturalesart.com/public_html/wp-content/plugins/club-natureza-miembros/'
          sftp_only: true
